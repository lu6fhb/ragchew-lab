// ---- Morse y audio
function enc(text,wpm,sty,eff){const u=1.2/wpm,ta=eff>0&&eff<wpm?(60*wpm-37.2*eff)/(19*wpm*eff):0,o=[],R=(a,b)=>a+Math.random()*(b-a);let f=1,ws=text.toUpperCase().split(/\s+/).filter(Boolean);
